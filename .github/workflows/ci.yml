name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Build (with Firebase config from repo file for CI)
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          VITE_TENANT_ID: production
        run: |
          if [ -z "$VITE_FIREBASE_CONFIG" ] && [ -f VITE_FIREBASE_CONFIG ]; then
            export VITE_FIREBASE_CONFIG="$(cat VITE_FIREBASE_CONFIG)"
          fi
          npm run build
      - name: Run CI checks
        run: npm run ci-check

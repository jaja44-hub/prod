name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          npm ci
      - name: Run vercel-build (writes service-account if env present)
        run: |
          npm run vercel-build
      - name: Run build
        run: |
          npm run build
      - name: Run CI checks
        run: |
          npm run ci-check
